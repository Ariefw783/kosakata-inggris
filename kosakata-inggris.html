<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulangan Kosakata Inggris - Kayla Zahra Safitri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: transparent;
        }
        .option-label:hover {
            background-color: #f1f5f9;
        }
        input[type="radio"]:checked + .option-content {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-hidden { display: none; }
    </style>
</head>
<body class="p-4 md:p-6">

    <!-- Start Screen -->
    <div id="start-screen" class="max-w-xl mx-auto bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100 text-center">
        <div class="mb-6">
            <div class="w-20 h-20 bg-indigo-50 rounded-3xl flex items-center justify-center mx-auto text-3xl mb-4">📝</div>
            <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Ulangan Kosakata</h1>
            <p class="text-slate-400 text-xs font-bold mt-1 tracking-widest">INGGRIS - INDONESIA (SLIDE VERSION)</p>
        </div>

        <div class="bg-slate-50 rounded-2xl p-6 mb-8 text-left space-y-3">
            <div class="flex justify-between text-[11px] font-bold uppercase tracking-wider">
                <span class="text-slate-400">Nama Siswa:</span>
                <span class="text-slate-800">Kayla Zahra Safitri</span>
            </div>
            <div class="flex justify-between text-[11px] font-bold uppercase tracking-wider">
                <span class="text-slate-400">Hari, Tanggal:</span>
                <span class="text-slate-800">Jumat, 31 Juli 2026</span>
            </div>
            <div class="flex justify-between text-[11px] font-bold uppercase tracking-wider">
                <span class="text-slate-400">Durasi:</span>
                <span class="text-indigo-600">10 Menit</span>
            </div>
            <div class="flex justify-between text-[11px] font-bold uppercase tracking-wider">
                <span class="text-slate-400">Jumlah Soal:</span>
                <span class="text-slate-800">9 Pilihan Ganda</span>
            </div>
        </div>

        <button onclick="startQuiz()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black uppercase tracking-[0.2em] shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">
            Mulai Mengerjakan
        </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden max-w-2xl mx-auto">
        <!-- Sticky Header Quiz -->
        <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 pb-4 mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-sm font-black text-slate-800 uppercase">Kayla Zahra Safitri</h2>
                <div class="flex items-center gap-2">
                    <div class="w-24 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Soal 1/9</p>
                </div>
            </div>
            <div class="text-right">
                <div id="timer" class="text-xl font-black font-mono text-indigo-600">10:00</div>
            </div>
        </div>

        <!-- Questions Container (Slide Format) -->
        <form id="quiz-form" class="relative min-h-[400px]">
            <!-- Slides injected here -->
        </form>

        <!-- Navigation Buttons -->
        <div class="fixed bottom-6 left-0 right-0 px-6">
            <div class="max-w-2xl mx-auto flex gap-3">
                <button id="prev-btn" onclick="prevSlide()" class="hidden flex-1 py-4 bg-white border border-slate-200 text-slate-400 rounded-2xl font-black uppercase tracking-[0.2em] hover:bg-slate-50 transition-all">
                    Kembali
                </button>
                <button id="finish-btn" onclick="finishQuiz()" class="hidden flex-[2] py-4 bg-indigo-600 text-white rounded-2xl font-black uppercase tracking-[0.2em] shadow-lg shadow-indigo-100 transition-all">
                    Selesai & Kirim
                </button>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden max-w-xl mx-auto text-center py-12">
        <div id="result-icon" class="w-24 h-24 rounded-[2.5rem] flex items-center justify-center mx-auto text-4xl mb-6 shadow-xl"></div>
        <h2 id="result-status" class="text-2xl font-black text-slate-800 uppercase tracking-tight mb-2"></h2>
        <p class="text-slate-400 text-sm mb-8">Hasil evaluasi belajar kamu telah terekam.</p>
        
        <div class="bg-white rounded-[2rem] p-10 border border-slate-100 shadow-sm inline-block min-w-[200px] mb-10">
            <span class="block text-slate-400 text-[10px] font-black uppercase tracking-[0.3em] mb-2">Skor Akhir</span>
            <span id="final-score" class="text-7xl font-black text-indigo-600">0</span>
        </div>

        <div id="review-container" class="text-left max-w-md mx-auto hidden">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Laporan Perbaikan</h3>
                <span id="wrong-count" class="bg-rose-50 text-rose-500 text-[10px] px-2 py-1 rounded-lg font-bold"></span>
            </div>
            <div id="wrong-answers-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const questionsData = [
            { q: "Apa bahasa Inggris dari 'Buku'?", a: "Book", o: ["Book", "Pen", "Bag", "Pencil", "Ruler"] },
            { q: "Apa bahasa Inggris dari 'Apel'?", a: "Apple", o: ["Banana", "Orange", "Apple", "Grape", "Mango"] },
            { q: "Apa bahasa Inggris dari 'Bola'?", a: "Ball", o: ["Doll", "Ball", "Car", "Bike", "Kite"] },
            { q: "Apa bahasa Inggris dari 'Pohon'?", a: "Tree", o: ["Flower", "Grass", "Tree", "Leaf", "Plant"] },
            { q: "Apa arti dari kosakata 'Bird'?", a: "Burung", o: ["Kucing", "Anjing", "Burung", "Ikan", "Ayam"] },
            { q: "Apa arti dari kosakata 'Car'?", a: "Mobil", o: ["Motor", "Sepeda", "Mobil", "Bis", "Kereta"] },
            { q: "Apa bahasa Inggris dari 'Rumah'?", a: "House", o: ["School", "Hospital", "House", "Park", "Store"] },
            { q: "Apa arti dari kosakata 'School'?", a: "Sekolah", o: ["Rumah", "Sekolah", "Taman", "Pasar", "Kantor"] },
            { q: "Apa bahasa Inggris dari 'Pulpen'?", a: "Pen", o: ["Pencil", "Pen", "Eraser", "Ruler", "Book"] }
        ];

        let currentSlide = 0;
        let timeLeft = 600; 
        let timerId = null;
        let score = 0;
        let wrongAnswersReport = [];
        const totalQuestions = questionsData.length;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            renderSlides();
            showSlide(0);
            startTimer();
        }

        function renderSlides() {
            const form = document.getElementById('quiz-form');
            form.innerHTML = questionsData.map((item, index) => `
                <div id="slide-${index}" class="slide-hidden">
                    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm fade-in">
                        <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Pertanyaan ${index + 1}</p>
                        <h3 class="text-sm font-bold text-slate-800 mb-6">${item.q}</h3>
                        <div class="grid grid-cols-1 gap-3">
                            ${item.o.map((opt, i) => {
                                const char = String.fromCharCode(97 + i);
                                return `
                                    <label class="option-label relative cursor-pointer">
                                        <input type="radio" name="q${index}" value="${opt}" class="hidden" onchange="autoNext(${index})">
                                        <div class="option-content border border-slate-200 rounded-xl p-4 flex items-center gap-3 transition-all">
                                            <span class="w-6 h-6 rounded-lg bg-slate-50 flex items-center justify-center text-[10px] font-black text-slate-400 border border-slate-100 uppercase">${char}</span>
                                            <span class="text-xs font-semibold text-slate-600">${opt}</span>
                                        </div>
                                    </label>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showSlide(index) {
            document.querySelectorAll('[id^="slide-"]').forEach(s => s.classList.add('slide-hidden'));
            document.getElementById(`slide-${index}`).classList.remove('slide-hidden');
            
            // Progress Update
            const prog = ((index + 1) / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${prog}%`;
            document.getElementById('progress-text').innerText = `Soal ${index + 1}/${totalQuestions}`;

            // Buttons Visibility
            document.getElementById('prev-btn').classList.toggle('hidden', index === 0);
            
            // Show Finish button on last slide if answered
            const isLast = index === totalQuestions - 1;
            const finishBtn = document.getElementById('finish-btn');
            finishBtn.classList.toggle('hidden', !isLast);
            
            currentSlide = index;
        }

        function autoNext(index) {
            if (index < totalQuestions - 1) {
                setTimeout(() => {
                    showSlide(index + 1);
                }, 300); // Small delay so user sees selection
            } else {
                // If it's the last question, enable finish button style
                document.getElementById('finish-btn').classList.remove('hidden');
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (timeLeft <= 60) {
                    document.getElementById('timer').classList.replace('text-indigo-600', 'text-rose-500');
                    document.getElementById('timer').classList.add('animate-pulse');
                }
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    finishQuiz(true);
                }
            }, 1000);
        }

        function finishQuiz(isForced = false) {
            clearInterval(timerId);
            calculateResults();

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const scoreDisplay = document.getElementById('final-score');
            const statusDisplay = document.getElementById('result-status');
            const iconDisplay = document.getElementById('result-icon');
            const finalScoreVal = Math.round(score);
            
            scoreDisplay.innerText = finalScoreVal;

            if (finalScoreVal >= 80) {
                statusDisplay.innerText = "Luar Biasa!";
                iconDisplay.innerText = "🏆";
                iconDisplay.className = "w-24 h-24 rounded-[2.5rem] flex items-center justify-center mx-auto text-4xl mb-6 shadow-xl bg-emerald-50 text-emerald-500";
            } else if (finalScoreVal >= 60) {
                statusDisplay.innerText = "Bagus!";
                iconDisplay.innerText = "⭐";
                iconDisplay.className = "w-24 h-24 rounded-[2.5rem] flex items-center justify-center mx-auto text-4xl mb-6 shadow-xl bg-amber-50 text-amber-500";
            } else {
                statusDisplay.innerText = "Tetap Semangat!";
                iconDisplay.innerText = "💪";
                iconDisplay.className = "w-24 h-24 rounded-[2.5rem] flex items-center justify-center mx-auto text-4xl mb-6 shadow-xl bg-slate-50 text-slate-500";
            }

            if (wrongAnswersReport.length > 0) {
                document.getElementById('review-container').classList.remove('hidden');
                document.getElementById('wrong-count').innerText = `${wrongAnswersReport.length} Salah`;
                const list = document.getElementById('wrong-answers-list');
                list.innerHTML = wrongAnswersReport.map(item => `
                    <div class="p-4 rounded-xl bg-white border border-slate-100 shadow-sm text-xs">
                        <p class="font-bold text-slate-800 mb-1">${item.question}</p>
                        <div class="flex justify-between">
                            <span class="text-rose-500">Kamu: ${item.userAnswer || '-'}</span>
                            <span class="text-emerald-600 font-bold">Benar: ${item.correctAnswer}</span>
                        </div>
                    </div>
                `).join('');
            }

            // INTEGRASI: Kirim Score + Detail Kesalahan
            window.parent.postMessage({ 
                type: 'SAVE_SCORE_ADVANCED', 
                score: finalScoreVal,
                wrongAnswers: wrongAnswersReport,
                totalQuestions: totalQuestions,
                studentName: "Kayla Zahra Safitri",
                date: "2026-07-31"
            }, '*');
        }

        function calculateResults() {
            const formData = new FormData(document.getElementById('quiz-form'));
            let correctCount = 0;
            wrongAnswersReport = [];

            questionsData.forEach((item, index) => {
                const userChoice = formData.get(`q${index}`);
                if (userChoice === item.a) {
                    correctCount++;
                } else {
                    wrongAnswersReport.push({
                        question: item.q,
                        userAnswer: userChoice,
                        correctAnswer: item.a
                    });
                }
            });

            score = (correctCount / totalQuestions) * 100;
        }
    </script>
</body>
</html>
